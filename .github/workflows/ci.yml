name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      # The test suite has zero runtime dependencies, so no install step.
      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
      # No package-lock.json is committed, so install (not ci) for the devDeps.
      - name: Install dev dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Lint
        run: npm run lint

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.x'
      # The fork maps package "X.Y.Z-hardened.N" to manifest "X.Y.Z.N"; the
      # build checks that mapping and that dist/thunderbird-mcp.xpi and
      # dist/SHA256SUMS are byte-for-byte the reproducible build of this
      # checkout (scripts/build-xpi.cjs).
      - name: Verify versions and the reproducible XPI
        run: node scripts/build-xpi.cjs --verify
